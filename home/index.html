<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sutton Kitchen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sutton Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a kitchen-counter board. Clock bar on top; three columns below:
   dinner (tonight + coming up), leftovers, then bills and house points. Written for older iPad Safari too:
   no flexbox gap, no inset, no clamp(), no optional chaining. */
:root{
  --bg:#f4f2ec; --card:#ffffff; --ink:#1c211d; --muted:#5d665f; --faint:#98a199; --line:#e0ded6;
  --basil:#2f6b4f; --basil-soft:#e3efe7; --mustard:#d99a17; --mustard-soft:#fbf0d6;
  --danger:#b3412f; --danger-soft:#f8e3de; --blue:#1f5fae; --blue-soft:#e3ecf8; --plum:#7a4a8c; --plum-soft:#f1e7f5;
  --display:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
  --body:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121512; --card:#1b201c; --ink:#e7ece8; --muted:#a2ada5; --faint:#6c776f; --line:#2a312c;
  --basil:#7cc4a0; --basil-soft:#1f3329; --mustard:#f0bf55; --mustard-soft:#3a3020;
  --danger:#f08a76; --danger-soft:#3f2420; --blue:#8db8f0; --blue-soft:#1d2a3d; --plum:#d0a4e0; --plum-soft:#2f2336; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121512; --card:#1b201c; --ink:#e7ece8; --muted:#a2ada5; --faint:#6c776f; --line:#2a312c;
  --basil:#7cc4a0; --basil-soft:#1f3329; --mustard:#f0bf55; --mustard-soft:#3a3020;
  --danger:#f08a76; --danger-soft:#3f2420; --blue:#8db8f0; --blue-soft:#1d2a3d; --plum:#d0a4e0; --plum-soft:#2f2336; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media (min-width:1000px){body{font-size:17px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
/* weather */
.wx{flex:1;min-width:0;display:flex;align-items:center;margin:0 24px}
.wx .ic{font-size:44px;line-height:1;margin-right:12px}
.wx .t{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin-right:14px;font-variant-numeric:tabular-nums}
.wx .l{min-width:0;font-size:15px;line-height:1.35}
.wx .l b{font-weight:600}
.wx .hint{color:var(--blue);font-weight:600}
.wx .hint.wet{color:var(--plum)}
/* trash */
.right{text-align:right}
.trash{display:inline-block;text-align:left;border-radius:14px;padding:8px 14px;margin-bottom:6px;font-size:14px;line-height:1.3;background:var(--card);border:1px solid var(--line)}
.trash b{display:block;font-size:16px}
.trash.now{background:var(--mustard);border-color:var(--mustard);color:#1c211d}
.trash.today{background:var(--mustard-soft);border-color:var(--mustard)}
.trash.quiet{background:none;border-color:transparent;color:var(--faint);padding:0 0 4px}
.trash.quiet b{display:inline;font-size:14px;font-weight:500}
@media (max-width:899px){.wx{order:3;flex-basis:100%;margin:12px 0 0}}
.clock{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:24px;font-weight:500;margin-left:4px;color:var(--muted)}
.date{font-size:19px;color:var(--muted);margin-top:4px}
.status{font-size:13px;color:var(--faint);text-align:right;padding-bottom:4px}
.status button{border:0;background:none;color:var(--faint);text-decoration:underline;padding:0;margin-left:8px;font-size:13px}
.status .warn{color:var(--danger)}
@media (min-width:1000px){.clock{font-size:64px}.clock small{font-size:28px}}

.board{display:grid;grid-template-columns:1.15fr 1fr 1fr;grid-gap:16px;gap:16px;align-items:start}
.col > .panel{margin-bottom:16px}
.col > .panel:last-child{margin-bottom:0}
@media (max-width:899px){
  .board{grid-template-columns:1fr 1fr}
  .col3{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;grid-gap:16px;gap:16px;align-items:start}
  .col3 > .panel{margin-bottom:0}
}
@media (max-width:599px){.board,.col3{grid-template-columns:1fr}.clock{font-size:44px}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ph h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--body);font-weight:600}
.ph .tag{font-size:13px;color:var(--faint)}
.ph h2::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:1px;background:var(--accent,var(--faint))}
.dinner{--accent:var(--basil)} .shop{--accent:var(--danger)}
.shop-items{font-size:15px;line-height:1.5}
.shop-items span{display:inline-block;margin-right:14px}
.shop-items span::before{content:"• ";color:var(--faint)}
.shop-items .sale{font-size:11px;font-weight:700;color:var(--danger);margin-left:4px}
.shop-foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)} .left{--accent:var(--mustard)} .bills{--accent:var(--plum)} .hp{--accent:var(--blue)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.empty{color:var(--faint);font-size:15px;padding:6px 0}
.note-err{font-size:13px;color:var(--danger);margin-top:10px}

/* tonight */
.tonight{background:var(--basil-soft);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.tonight .lbl{font-size:13px;font-weight:600;color:var(--basil);text-transform:uppercase;letter-spacing:.07em}
.tonight .main{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px;word-wrap:break-word;overflow-wrap:anywhere}
.tonight .sides{font-size:17px}
.tonight .sides span{display:inline-block;margin-right:12px}
.tonight .sides span::before{content:"+ ";color:var(--faint)}
.tonight .who{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--card);color:var(--basil)}
.tonight .nt{font-size:14px;font-style:italic;color:var(--muted);margin-top:8px}
.tonight.none .main{color:var(--muted);font-size:24px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .d{width:52px;flex:none;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rows .w{flex:1;min-width:0;overflow-wrap:anywhere}
.rows .x{flex:none;margin-left:10px;font-size:13px;color:var(--faint);text-align:right}
.prep{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.prep b{color:var(--ink);font-weight:600}

/* chips */
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.chip.ok{background:var(--basil-soft);color:var(--basil)}
.chip.soon{background:var(--mustard-soft);color:var(--ink)}
.chip.old{background:var(--danger);color:var(--card)}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.auto{background:var(--line);color:var(--muted)}
.chip.paid{background:var(--basil-soft);color:var(--basil)}

/* leftovers */
.lo{display:flex;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px}
.lo:last-child{margin-bottom:0}
.lo.soon{border-color:var(--mustard);background:var(--mustard-soft)}
.lo.old{border-color:var(--danger);background:var(--danger-soft)}
.lo .n{flex:1;min-width:0;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.lo .m{font-size:13px;color:var(--muted);font-weight:400;display:block;margin-top:1px}
.lo .chip{margin-left:10px}

/* bills */
.bill{display:flex;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bill:first-child{border-top:0}
.bill .n{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.bill .when{flex:none;font-size:14px;color:var(--muted);margin-left:10px;text-align:right}
.bill .chip{margin-left:8px}
.bill.paid .n{color:var(--faint);text-decoration:line-through}
.bill.late .when{color:var(--danger);font-weight:600}

/* house points */
.who-row{margin-bottom:12px}
.who-row:last-of-type{margin-bottom:14px}
.who-top{display:flex;align-items:baseline;justify-content:space-between}
.who-top .nm{font-weight:600;font-size:17px}
.who-top .pts{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.who-top .pts small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.bar.done i{background:var(--basil)}
.who-sub{font-size:13px;color:var(--muted);margin-top:4px}
.goals{display:grid;grid-template-columns:1fr 1fr;grid-gap:8px 14px;gap:8px 14px;padding-top:12px;border-top:1px solid var(--line)}
.goal{font-size:13px;min-width:0}
.goal .gt{display:flex;justify-content:space-between}
.goal .gt span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:6px}
.goal .gt b{font-variant-numeric:tabular-nums;font-weight:600}
.goal .bar{height:6px;margin-top:3px}

.lo.soon .chip.soon{background:var(--mustard);color:#1c211d}
/* an older landscape iPad (768pt tall): tighten so the whole board fits without scrolling */
@media (orientation:landscape) and (max-height:830px) and (min-width:900px){
  body{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:12px}
  .top{margin-bottom:10px}
  .wx .ic{font-size:36px}.wx .t{font-size:34px}.wx .l{font-size:14px}
  .trash{padding:6px 12px;margin-bottom:3px}.trash b{font-size:15px}.status{padding-bottom:0}
  .clock{font-size:44px}.clock small{font-size:22px}.date{font-size:16px;margin-top:2px}
  .panel{padding:12px 16px 14px}.ph{margin-bottom:8px}
  .col > .panel{margin-bottom:12px}.board{grid-gap:12px;gap:12px}
  .tonight{padding:12px 16px;margin-bottom:8px}.tonight .main{font-size:26px}
  .rows li{padding:7px 0}.bill{padding:6px 0}.lo{padding:8px 12px;margin-bottom:6px}
  .who-row{margin-bottom:8px}.who-row:last-of-type{margin-bottom:10px}.who-top .pts{font-size:21px}
  .goals{padding-top:9px}
}
/* passcode */
.gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}
.gate h2{font-size:24px;margin-bottom:6px}
.gate p{margin:0 0 14px;color:var(--muted);font-size:15px}
.gate input{font:inherit;width:100%;text-align:center;font-size:22px;letter-spacing:.3em;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);margin-bottom:12px}
.gate button{width:100%;border:0;border-radius:999px;padding:13px;background:var(--basil);color:#fff;font-weight:600;font-size:16px}
.gate .err{color:var(--danger);font-size:14px;margin:0 0 12px}
</style>
</head>
<body>
<header class="top">
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
  <div class="wx" id="wx" aria-live="polite"></div>
  <div class="right">
    <div class="trash quiet" id="trash"></div>
    <div class="status" id="status">Loading…</div>
  </div>
</header>

<main class="board">
  <div class="col col1">
    <section class="panel dinner" aria-labelledby="hDin"><div class="ph"><h2 id="hDin">Dinner</h2><span class="tag" id="dinTag"></span></div><div id="dinner"><p class="empty">Loading…</p></div></section>
  </div>
  <div class="col col2">
    <section class="panel left" aria-labelledby="hLo"><div class="ph"><h2 id="hLo">Leftovers</h2><span class="tag" id="loTag"></span></div><div id="leftovers"><p class="empty">Loading…</p></div></section>
    <section class="panel shop" aria-labelledby="hShop" id="shopPanel" hidden><div class="ph"><h2 id="hShop">Shopping list</h2><span class="tag" id="shopTag"></span></div><div id="shop"><p class="empty">Loading…</p></div></section>
  </div>
  <div class="col col3">
    <section class="panel bills" aria-labelledby="hBills"><div class="ph"><h2 id="hBills">Bills this week</h2></div><div id="bills"><p class="empty">Loading…</p></div></section>
    <section class="panel hp" aria-labelledby="hHp"><div class="ph"><h2 id="hHp">House points</h2><span class="tag">This week</span></div><div id="points"><p class="empty">Loading…</p></div></section>
  </div>
</main>
<div id="gate"></div>

<script>
/* Sutton Kitchen: a read-only board over the family's three Google Sheets.
   It only ever sends {action:'load'}; it never writes. */
(function () {
  'use strict';
  var SOURCES = {
    meal:  { name: 'Dinner Plan', url: 'https://script.google.com/macros/s/AKfycbx_xbFv9C6K_pvVLIBI0wRAIH0k4y5gpvVhX9FbWPz-x-yQ6J3tPCe4_xjlbxk-cb4m/exec' },
    hp:    { name: 'House Points', url: 'https://script.google.com/macros/s/AKfycbwhmRHwCkFvserzzrVKLG8QYLtYY1nCQ1ONTct6AZWIa0uN2YgkC0ZHq_voLGxfdFED/exec' },
    bills: { name: 'Bill Book', url: 'https://script.google.com/macros/s/AKfycbyxt-6hXgWyWZ9i8NA33Awr4HgNWMNoaNI112kxLyHRyOH8aqV9_REgjk5fmY9yXxRO/exec' },
    shop:  { name: 'Shopping List', url: 'PASTE_SHOPPING_LIST_WEB_APP_URL_HERE' }
  };
  /* a sheet without an address yet (the shopping list, until it's set up) is simply left off the board */
  var KEYS = Object.keys(SOURCES).filter(function (k) { return SOURCES[k].url.indexOf('script.google.com') > 0; });
  var REFRESH_MS = 2 * 60 * 1000;          // each sheet is read every 2 minutes
  var BILL_DAYS = 7;
  /* leftovers: same good-through rules as the Dinner Plan app (USDA 3-4 days, short end; a few foods 2) */
  var SHORT_RE = /gravy|broth|\bstock\b|seafood|fish|shrimp|salmon|tilapia|\bcod\b|crab|lobster|scallop|\bclams?\b|mussel|oyster|sushi/i;
  function goodDays(v) { var g = +v.goodDays; return g >= 1 && g <= 4 ? g : (SHORT_RE.test(v.name || '') ? 2 : 3); }
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  /* ---------- small helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromKey(k) { var p = String(k).split('-'); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function sundayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function daysBetween(a, b) { return Math.round((b - a) / 864e5); }
  function md(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function vals(o) { return o ? Object.keys(o).map(function (k) { return o[k]; }) : []; }
  function dayWord(d) {
    var n = daysBetween(today(), d);
    if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
    if (n > 1 && n < 7) return DAYS[d.getDay()].slice(0, 3);
    return md(d);
  }

  /* ---------- reading the sheets ---------- */
  var PASS = lsGet('kitchen-pass') || '';
  /* an app whose sheet has its own passcode (House Points has a separate "household passcode") gets one saved just for it */
  var OWN = {}, skipped = {};
  KEYS.forEach(function (k) { OWN[k] = lsGet('kitchen-pass-' + k) || ''; });
  function passFor(k) { return OWN[k] || PASS; }
  var data = {}, state = {}, lastOk = {};
  KEYS.forEach(function (k) {
    try { var c = JSON.parse(lsGet('kitchen-cache-' + k) || 'null'); if (c && c.data) { data[k] = c.data; lastOk[k] = c.at; if (k === 'hp') privateHp(c.data); } } catch (e) {}
    state[k] = data[k] ? 'cached' : 'loading';
  });

  /* Rewards are private: drop every reward description and keep only whose points a cash-in used and how many,
     so balances stay right without showing what was cashed in. */
  function privateHp(d) {
    delete d.rewards;
    var r = d.redemptions || {}, out = {};
    Object.keys(r).forEach(function (id) { var x = r[id]; if (x) out[id] = { who: x.who, cost: Number(x.cost) || 0, status: x.status }; });
    d.redemptions = out;
  }

  function load(k, retry) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null;
    return fetch(SOURCES[k].url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'load', passcode: passFor(k) }), signal: ctl ? ctl.signal : undefined, redirect: 'follow', cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        if (timer) clearTimeout(timer);
        var j; try { j = JSON.parse(t); } catch (e) { throw { code: 'not_json' }; }
        if (!j.ok) throw { code: j.error === 'bad_passcode' || j.error === 'locked' ? j.error : 'unavailable' };
        data[k] = j.data || {}; lastOk[k] = Date.now(); state[k] = 'ok';
        if (k === 'hp') privateHp(data[k]);
        lsSet('kitchen-cache-' + k, JSON.stringify({ at: lastOk[k], data: data[k] }));
      }, function (e) { if (timer) clearTimeout(timer); throw e && e.code ? e : { code: 'network' }; })
      .catch(function (e) {
        /* this app's own saved passcode stopped working: if the app now uses the family passcode, switch back to it */
        if (e.code === 'bad_passcode' && OWN[k] && OWN[k] !== PASS && !retry) { OWN[k] = ''; lsSet('kitchen-pass-' + k, null); return load(k, true); }
        state[k] = e.code || 'network';
      });
  }

  var busy = false;
  function refreshAll() {
    if (busy || !PASS) return;
    busy = true;
    /* a sheet that rejected the passcode is not asked again until a new passcode is entered:
       the dinner plan and bill book lock themselves after 10 wrong tries */
    var todo = KEYS.filter(function (k) { return state[k] !== 'bad_passcode' && state[k] !== 'locked'; });
    Promise.all(todo.map(function (k) { return load(k); })).then(function () {
      busy = false; renderAll();
      var bad = KEYS.filter(function (k) { return state[k] === 'bad_passcode'; });
      if (bad.length === KEYS.length) askPass('That passcode didn’t match. Try again.');
      else {

    if (!hint && now.getHours() >= 17 && d.time.length > di + 1) {
      var tw = wmo(d.weather_code[di + 1], true);
      hint = 'Tomorrow ' + tw[0] + ' ' + Math.round(d.temperature_2m_max[di + 1]) + '° / ' + Math.round(d.temperature_2m_min[di + 1]) + '°';
    }
    if (!hint && now.getHours() < 11 && (feels < 45 || hi < 50)) hint = 'Coat weather';
    else if (!hint && now.getHours() < 11 && (feels < 58 || hi < 62)) hint = 'Jacket weather';
    var old = Date.now() - wxAt > 2 * 36e5 ? ' <span class="faint">(as of ' + esc(new Date(wxAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) + ')</span>' : '';
    el.innerHTML = '<span class="ic" aria-hidden="true">' + w[0] + '</span><span class="t">' + temp + '°</span><span class="l"><b>' + esc(w[1]) + '</b> · feels ' + feels + '°' + old +
      '<br>High ' + hi + '° · Low ' + lo + '°' + (pop >= 20 ? ' · ' + pop + '% rain' : '') +
      (hint ? '<br><span class="hint' + (wet ? ' wet' : '') + '">' + esc(hint) + '</span>' : '') + '</span>';
  }

  /* ---------- trash: curb window is Tuesday 4:00 PM to Wednesday 6:00 AM ---------- */
  function renderTrash() {
    var n = new Date(), dow = n.getDay(), h = n.getHours() + n.getMinutes() / 60, cls, txt;
    if ((dow === 2 && h >= 16) || (dow === 3 && h < 6)) { cls = 'now'; txt = dow === 2 ? '<b>🗑️ Trash to the curb tonight</b>Window open until 6 AM' : '<b>🗑️ Trash to the curb now</b>Pickup window ends at 6 AM'; }
    else if (dow === 2) { cls = 'today'; txt = '<b>Trash night</b>Out to the curb after 4 PM'; }
    else if (dow === 3) { cls = 'today'; txt = '<b>Pickup day</b>Bring the bins back in'; }
    else if (dow === 1) { cls = 'quiet'; txt = '<b>Trash night is tomorrow</b>'; }
    else { cls = 'quiet'; txt = '<b>Trash night: Tuesday after 4 PM</b>'; }
    var el = $('trash'); el.className = 'trash ' + cls; el.innerHTML = txt;
  }

  /* ---------- clock ---------- */
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('clock').innerHTML = ((h % 12) || 12) + ':' + pad(m) + '<small>' + (h < 12 ? 'AM' : 'PM') + '</small>';
    $('date').textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    renderTrash();
    var k = key(d); if (k !== tick.day) { var first = !tick.day; tick.day = k; if (!first) renderAll(); }   // new day: ages and "tonight" move on
  }

  /* keep the screen on where Safari allows it (iPadOS 16.4+); on older iPads set Auto-Lock to Never */
  var lock = null;
  function wake() { if (navigator.wakeLock && !document.hidden && !lock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }).catch(function () {}); }

  /* reload once overnight so updates to this page reach the iPad on their own */
  (function nightly() { var n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 3, 30); setTimeout(function () { location.reload(); }, t - n); })();

  tick(); setInterval(tick, 10000);
  renderWx(); loadWx(); setInterval(loadWx, 20 * 60 * 1000);
  renderAll();
  if (!PASS) askPass(''); else refreshAll();
  setInterval(refreshAll, REFRESH_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { refreshAll(); wake(); if (Date.now() - wxAt > 20 * 60 * 1000) loadWx(); } });
  wake();
})();
</script>
