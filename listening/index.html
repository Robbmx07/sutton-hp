<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Listening">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121614">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Listening Library</title>
<!-- Sutton Design System: theme switch + shared tokens -->
<script src="https://robbmx07.github.io/sutton-hp/design/sutton-theme.js"></script>
<link rel="stylesheet" href="https://robbmx07.github.io/sutton-hp/design/sutton.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Listening Library — Sutton Design System tokens (--s-*) + its own amber accent */
:root,:root[data-theme="dark"]{--accent:#F0A955;--accent-ink:#1E1407;--accent-soft:#3A2A14;--ai:#9BB8F5;--ai-soft:#1D2840;--pod:#7FD1C7;--pod-soft:#163330}
:root[data-theme="light"]{--accent:#A85F12;--accent-ink:#FFFFFF;--accent-soft:#FBEBD5;--ai:#3557A8;--ai-soft:#E2E9F8;--pod:#1F7A70;--pod-soft:#DDF2EF}
:root{--s-accent:var(--accent);--nav-h:64px;--mini-h:64px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--s-bg);color:var(--s-ink)}
body{font:15px/1.45 var(--s-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--s-display);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--s-muted)}.faint{color:var(--s-faint)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--s-tap);padding:0 18px;border-radius:999px;border:1px solid var(--s-line);background:var(--s-card);color:var(--s-ink);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--s-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg,.icon-btn svg{width:20px;height:20px;flex:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:var(--s-tap);height:var(--s-tap);border-radius:999px;border:0;background:transparent;color:var(--s-ink);padding:0;flex:none}
.icon-btn:hover{background:var(--s-card-2)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--s-bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--s-line)}
.top h1{font-size:21px}
.avatar{width:38px;height:38px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;border:0;padding:0;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.sync-dot{width:8px;height:8px;border-radius:9px;background:var(--s-faint);display:inline-block}
.sync-dot.ok{background:var(--s-ok)}.sync-dot.busy{background:var(--s-warn)}.sync-dot.bad{background:var(--s-alert)}

/* ---------- Layout ---------- */
main{padding:16px 16px calc(var(--nav-h) + var(--mini-h) + 28px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:16px;box-shadow:var(--s-shadow)}
.banner{display:flex;gap:12px;align-items:center;background:var(--s-warn-soft);color:var(--s-ink);border-radius:var(--s-r);padding:12px 14px}
.banner.info{background:var(--accent-soft)}
.empty{text-align:center;padding:32px 16px;color:var(--s-muted)}
.empty h3{color:var(--s-ink);margin-bottom:6px}

/* ---------- Continue card ---------- */
.hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.hero .cover{width:96px;height:96px}
.bar{height:6px;border-radius:6px;background:var(--s-card-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}

/* ---------- Covers & grids ---------- */
.cover{position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,var(--accent-soft),var(--s-card-2));aspect-ratio:1/1;flex:none}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;font:700 12px/1.15 var(--s-display);color:var(--s-ink);opacity:.9}
.cover.pg{background:linear-gradient(145deg,var(--ai-soft),var(--s-card-2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.tile{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}
.tile .t{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .a{font-size:12.5px;color:var(--s-muted)}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.shelf .tile{width:128px;scroll-snap-align:start;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.ai{background:var(--ai-soft);color:var(--ai)}
.badge.ok{background:var(--s-ok-soft);color:var(--s-ok)}
.badge.pod{background:var(--pod-soft);color:var(--pod)}
.cover .badge{position:absolute;top:6px;left:6px}

/* ---------- Chips / segmented ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine) and (min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--s-line);background:transparent;color:var(--s-muted);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.shelf{border-color:var(--accent-soft);color:var(--s-ink)}
.chip.shelf[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.shelf-warn{color:var(--s-ink);background:var(--s-warn-soft);border-radius:var(--s-r-sm);padding:10px 12px}
.seg{display:flex;background:var(--s-card);border:1px solid var(--s-line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:14px;color:var(--s-muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- Inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--s-muted)}
.input,select.input{min-height:var(--s-tap);width:100%;border-radius:var(--s-r-sm);border:1px solid var(--s-line);background:var(--s-card);padding:0 14px;color:var(--s-ink)}
.search{position:relative}
.search .input{padding-left:42px;border-radius:999px}
.search svg{position:absolute;left:14px;top:12px;width:20px;height:20px;color:var(--s-faint)}

/* ---------- List rows ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--s-line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;min-height:52px}
.li:last-child{border-bottom:0}
.li .num{width:28px;text-align:center;color:var(--s-faint);font-size:13px;flex:none}
.li.now .num,.li.now .grow b{color:var(--accent)}
.stat{font-size:12px;color:var(--s-faint);white-space:nowrap}
.stat.ready{color:var(--s-ok)}.stat.work{color:var(--s-warn)}

/* ---------- Mini player + nav ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s-card);border-top:1px solid var(--s-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.mini{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--s-line);height:var(--mini-h);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.mini .cover{width:46px;height:46px}
.mini .prog{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.mini .prog i{display:block;height:100%;background:var(--accent)}
nav.tabs{display:flex;height:var(--nav-h);max-width:600px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--s-faint);font-size:11.5px;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--s-scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--s-bg);border-radius:20px 20px 0 0;border-top:1px solid var(--s-line);transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--s-line);margin:4px auto 10px}
.sheet-close{position:absolute;right:10px;top:10px}
.detail-top{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:end;margin:6px 0 16px}
.desc{color:var(--s-muted);font-size:14px;max-height:9.5em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.about{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:14px 16px;margin:4px 0 8px}
.about h3{margin-bottom:8px}
.about dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 10px;font-size:14px}
.about dt{color:var(--s-muted);font-weight:600}
.about dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}

/* ---------- Full player ---------- */
.fp{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.fp .cover{width:min(68vw,300px);height:auto}
.fp h2{font-size:20px}
.scrub{width:100%;accent-color:var(--accent);height:28px}
.times{display:flex;justify-content:space-between;width:100%;font-size:12.5px;color:var(--s-muted);margin-top:-6px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:14px}
.ctrls .icon-btn svg{width:28px;height:28px}
.play-big{width:72px;height:72px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.play-big svg{width:34px;height:34px}
.fp-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:13px;color:var(--s-muted);background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r-sm);padding:10px 12px;text-align:left;width:100%}

/* ---------- Gate ---------- */
.gate{position:fixed;inset:0;z-index:90;background:var(--s-bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate .logo{width:84px;height:84px;margin:0 auto 4px;border-radius:22px}
.gate h1{font-size:28px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--mini-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:95;background:var(--s-ink);color:var(--s-bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.spin{width:18px;height:18px;border-radius:99px;border:2px solid var(--s-line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--s-line)}
.set-row:last-child{border-bottom:0}
@media (min-width:760px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .shelf .tile{width:150px}
}
</style>
</head>
<body>

<!-- Sign-in gate -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <img class="logo" src="icon-192.png" alt="">
    <span class="s-kicker">Sutton</span>
    <h1>Listening Library</h1>
    <p class="muted">Free audiobooks and AI‑read classics. Your own library, saved to your own Google Drive.</p>
    <button class="btn primary block" id="g-signin">Sign in with Google</button>
    <p class="small faint" id="g-setup-note" hidden>Google sign‑in isn't switched on yet. Use this device only for now, or ask Robert to finish setup.</p>
    <button class="link" id="g-local">Use on this device only (no sync)</button>
  </div>
</div>

<header class="top" id="top">
  <div class="grow">
    <span class="s-kicker">Sutton</span>
    <h1 id="view-title">Listen</h1>
  </div>
  <span class="sync-dot" id="sync-dot" title="Sync status"></span>
  <button class="avatar" id="avatar" aria-label="Account and settings">?</button>
</header>

<main id="main">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-discover" hidden></section>
  <section class="view" id="v-library" hidden></section>
  <section class="view" id="v-settings" hidden></section>
</main>

<div class="dock">
  <button class="mini" id="mini" hidden style="position:relative">
    <span class="prog"><i id="mini-prog" style="width:0"></i></span>
    <span class="cover" id="mini-cover"></span>
    <span class="grow" style="min-width:0">
      <b class="ell" style="display:block" id="mini-title"></b>
      <span class="ell small muted" style="display:block" id="mini-sub"></span>
    </span>
    <span class="icon-btn" id="mini-play" role="button" aria-label="Play or pause"></span>
  </button>
  <nav class="tabs" id="tabs">
    <button data-v="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"/></svg>Listen</button>
    <button data-v="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Discover</button>
    <button data-v="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M9 19V5M14 19l-1-14M18 19 21 6"/><path d="M3 19h18"/></svg>Library</button>
    <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="icon-btn sheet-close" id="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="au" preload="auto" playsinline></audio>
<input type="file" id="file-in" accept=".txt,.pdf,text/plain,application/pdf" multiple hidden>

<script>

  var TOPICS_POD = ['Homesteading', 'Gardening', 'Food preservation', 'Personal finance', 'Frugal living', 'Self-reliance', 'Cooking', 'Woodworking', 'DIY home repair', 'History', 'Science', 'Health'];

  function readPart(f, onP) {
    var isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; if (isPdf) r.readAsArrayBuffer(f); else r.readAsText(f); })
      .then(function (data) { return isPdf ? pdfToText(data, onP).then(function (t) { return { name: f.name, text: t, pdf: true }; }) : { name: f.name, text: data }; });
  }
  var pickFor = null;
  $('#file-in').addEventListener('change', function () {
    var files = Array.prototype.slice.call(this.files || []); this.value = ''; if (!files.length) return;
    files.sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
    var target = pickFor ? book(pickFor) : null, parts = [], i = 0;
    if (S.detail && target) { S.detail.pdfBusy = true; S.detail.pdfP = 0; renderDetail(); }
    toast('Reading ' + (files.length > 1 ? files.length + ' files' : 'the file') + '…', 3000);
    (function next() {
      if (i >= files.length) return Promise.resolve();
      var f = files[i];
      return readPart(f, function (p) { if (S.detail) { S.detail.pdfP = (i + p) / files.length; renderDetail(); } }).then(function (pt) { parts.push(pt); i++; return next(); });
    })().then(function () {
      if (!target) {
        var nm = files[0].name.replace(/\.(txt|pdf)$/i, '').replace(/[_-]+/g, ' '), k = 'txt:' + now();
        target = addBook({ key: k, src: 'txt', id: k, title: nm, author: '' });
      } else if (target.src === 'pg') checkTitle(target, parts[0].text);
      return prepareParts(target, parts);
    }).then(function () {
      toast('Ready: ' + target.chapters.length + (target.src === 'pg' ? ' chapters' : ' sections'));
      if (S.detail && S.detail.item.key === target.key) { S.detail.textErr = false; S.detail.pdfBusy = false; renderDetail(); } else openDetail(target);
      renderSoft();
    }).catch(function (e) { if (S.detail) { S.detail.pdfBusy = false; renderDetail(); } toast(e.message, 5000); });
  });
  function saveOffline(b) {
    var todo = b.chapters.map(function (c, i) { return i; }).filter(function (i) { return !S.local[audioKey(b.key, i)] && (b.src !== 'pod' || (i >= (b.pos.ch || 0) && i < (b.pos.ch || 0) + 3)); });
    if (!todo.length) { toast('Already saved for offline'); return; }
    var n = 0; toast('Saving ' + todo.length + ' chapters for offline…', 4000);
    (function next() {
      if (!todo.length) { toast('Saved for offline: ' + b.title); renderSoft(); return; }
      var i = todo.shift();
      fetch(b.chapters[i].url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
        .then(function (bl) { return putBlob(audioKey(b.key, i), bl).then(function () { S.local[audioKey(b.key, i)] = bl.size; saveSizes(); n++; if (S.sheet === 'detail') renderDetail(); next(); }); })
        .catch(function (e) { toast(n ? 'Saved ' + n + ' chapters; the rest will stream (' + e.message + ')' : 'This recording can only stream here, not save offline.', 5000); renderSoft(); });
    })();
  }
  function exportLib() {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.lib, null, 1)], { type: 'application/json' }));
    a.download = 'listening-library-backup.json'; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500);
  }
  function importLib() {
    var i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () { var f = i.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { try { var lib = JSON.parse(r.result); if (!lib.books) throw new Error('Not a library backup'); S.lib = mergeLib(S.lib, lib); saveLib(); render(); toast('Backup merged in'); } catch (e) { toast(e.message); } }; r.readAsText(f); };
    i.click();
  }
  function previewVoice() {
    var v = set().voice, note = $('#voice-note');
    if (v === 'device') { var u = new SpeechSynthesisUtterance('This is your device voice. It starts instantly, but stops when the screen locks.'); u.rate = set().speed; speechSynthesis.speak(u); return; }
    note.innerHTML = '<span class="spin"></span> Loading voice…';
    loadPiper().then(function (tts) {
      return tts.stored().then(function (have) { if (have && have.indexOf(v) >= 0) return; return tts.download(v, function (p) { if (p && p.total) note.textContent = 'Downloading voice ' + Math.round(p.loaded * 100 / p.total) + '%'; }); })
        .then(function () { note.textContent = 'Speaking…'; return tts.predict({ text: 'It was a bright cold day in April. This is how your audiobooks will sound.', voiceId: v }); });
    }).then(function (wav) { var a = new Audio(URL.createObjectURL(wav)); a.playbackRate = set().speed; a.play(); note.textContent = 'Voice ready on this device'; })
      .catch(function (e) { note.textContent = 'Couldn’t load the AI voice here (' + e.message + '). Device voice still works.'; });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act'), key = t.getAttribute('data-key'), b = key ? book(key) : null;
    switch (act) {
      case 'go': show(t.getAttribute('data-v')); break;
      case 'open': case 'peek': { closeSheet(); var it = findItem(key); if (it) openDetail(it); break; }
      case 'reopen': if (S.detail) openDetail(S.detail.item); break;
      case 'moredesc': S.detail.descOpen = !S.detail.descOpen; renderDetail(); break;
      case 'add': addFromDetail(false); break;
      case 'addplay': unlock(); addFromDetail(true); break;
      case 'play': closeSheet(); playBook(key); openPlayer(); break;
      case 'playcur': playBook(S.lib.current); openPlayer(); break;
      case 'playch': {
        unlock(); var ch = +t.getAttribute('data-ch');
        if (!b) { var it2 = findItem(key); if (!it2) break; S.detail.item = it2; b = addBook(it2, S.detail.info); }
        if (!b.chapters.length) break;
        playBook(b.key, ch, (b.pos.ch === ch && !b.finished) ? b.pos.t : 0); openPlayer(); break;
      }
      case 'col': toggleCol(key, t.getAttribute('data-col')); renderDetail(); renderSoft(); break;
      case 'remove': if (confirm('Remove “' + b.title + '” from your library? Audio in your Drive stays in the “' + FOLDER_NAME + '” folder.')) { removeBook(key); closeSheet(); render(); toast('Removed'); } break;
      case 'offline': saveOffline(b); break;
      case 'convall': for (var i = 0; i < b.chapters.length; i++) enqueue(key, i); toast('Making audio for every chapter. Keep the app open.'); renderDetail(); break;
      case 'retry': delete S.prog[progKey(key, +t.getAttribute('data-ch'))]; enqueue(key, +t.getAttribute('data-ch'), true); break;
      case 'picktxt': pickFor = key; $('#file-in').click(); break;
      case 'addtxt': pickFor = null; $('#file-in').click(); break;
      case 'src': S.disc.src = t.getAttribute('data-src'); S.disc.topic = ''; renderDiscover(); runSearch(true); break; // shelf choice carries over between the two sources
      case 'topic': { var tp = t.getAttribute('data-topic'); S.disc.topic = tp === 'Popular' ? '' : tp; S.disc.shelf = null; S.disc.q = ''; renderDiscover(); runSearch(true); break; }
      case 'shelf': S.disc.shelf = +t.getAttribute('data-shelf'); S.disc.topic = ''; S.disc.q = ''; renderDiscover(); runSearch(true); break;
      case 'more': S.disc.page++; runSearch(false); break;
      case 'research': runSearch(true); break;
      case 'libcol': S.libCol = t.getAttribute('data-col'); renderLibrary(); break;
      case 'libsort': set().libSort = t.getAttribute('data-sort'); S.lib.settingsAt = now(); saveLib(); renderLibrary(); break;
      case 'gocol': S.libCol = t.getAttribute('data-col'); show('library'); break;
      case 'newcol': { var nm = prompt('Name the new collection'); nm = nm && nm.trim().slice(0, 40); if (nm && S.lib.collections.indexOf(nm) < 0) { S.lib.collections.push(nm); S.lib.collectionsAt = now(); saveLib(); S.libCol = nm; renderLibrary(); } break; }
      case 'delcol': { var c = t.getAttribute('data-col'); if (confirm('Delete the collection “' + c + '”? Books stay in your library.')) { S.lib.collections = S.lib.collections.filter(function (x) { return x !== c; }); S.lib.collectionsAt = now(); Object.keys(S.lib.books).forEach(function (k) { var bk = S.lib.books[k], j = bk.cols.indexOf(c); if (j >= 0) { bk.cols.splice(j, 1); touch(bk); } }); saveLib(); S.libCol = 'All'; renderLibrary(); } break; }
      case 'toggle': togglePlay(); break;
      case 'back': skip(-15); break;
      case 'fwd': skip(30); break;
      case 'prevch': nextCh(-1); break;
      case 'nextch': nextCh(1); break;
      case 'speed': cycleSpeed(); break;
      case 'sleep': cycleSleep(); break;
      case 'reconnect': reconnect(); break;
      case 'syncnow': syncNow(); renderSettings(); break;
      case 'switch': switchPerson(false); break;
      case 'signout': if (confirm('Sign out and remove this person’s library and downloaded audio from this device? Everything stays in their Google Drive.')) switchPerson(true); break;
      case 'upgrade': upgradeToGoogle(); break;
      case 'clearaudio': if (confirm('Clear downloaded audio from this device?')) { Object.keys(S.local).forEach(function (k) { DB.del('blobs', k); }); S.local = {}; saveSizes(); renderSettings(); toast('Cleared'); } break;
      case 'export': exportLib(); break;
      case 'import': importLib(); break;
      case 'preview': previewVoice(); break;
    }
  });
  function openPlayer() { openSheet('player'); renderFullPlayer(); }
  $('#mini').addEventListener('click', function (e) { if (e.target.closest('#mini-play')) { togglePlay(); return; } openPlayer(); });
  $$('#tabs button').forEach(function (b) { b.addEventListener('click', function () { closeSheet(); show(b.getAttribute('data-v')); }); });
  $('#avatar').addEventListener('click', function () { closeSheet(); show('settings'); });
  $('#scrim').addEventListener('click', closeSheet);
  $('#sheet-close').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* ================= Accounts ================= */
  function reconnect() {
    requestToken('', S.acct.email).then(function () { S.needAuth = false; render(); return syncNow(); }).then(retryUploads)
      .catch(function (e) { toast('Google sign-in didn’t finish: ' + e.message); });
  }
  function googleSignIn() {
    if (!clientId()) { toast('Google sign-in isn’t set up yet'); return; }
    var tokHint;
    requestToken('select_account').then(function () {
      return fetch(DRIVE + '/about?fields=user(displayName,emailAddress,photoLink)', { headers: { Authorization: 'Bearer ' + S.token } }).then(function (r) { if (!r.ok) throw new Error('Drive ' + r.status); return r.json(); });
    }).then(function (j) {
      var u = j.user || {}; tokHint = u.emailAddress;
      lsSet('ll-tok:' + tokHint, { t: S.token, e: S.tokenExp });
      var acct = { mode: 'google', email: u.emailAddress, name: (u.displayName || u.emailAddress || '').split(' ')[0], photo: u.photoLink || '' };
      var prevLocal = S.acct && S.acct.mode === 'local' ? S.lib : null;
      return start(acct, prevLocal);
    }).catch(function (e) { toast('Sign-in didn’t finish: ' + e.message, 4000); });
  }
  function upgradeToGoogle() { googleSignIn(); }
  function switchPerson(clear) {
    stopPlayback(); closeSheet();
    var p = Promise.resolve();
    if (clear) {
      p = DB.keys('blobs').then(function (ks) { return Promise.all(ks.filter(function (k) { return String(k).indexOf('audio:' + S.aid + ':') === 0; }).map(function (k) { return DB.del('blobs', k); })); })
        .then(function () { return DB.keys('kv'); }).then(function (ks) { return Promise.all(ks.filter(function (k) { return String(k).indexOf(':' + S.aid) > 0 || String(k).indexOf('text:' + S.aid + ':') === 0; }).map(function (k) { return DB.del('kv', k); })); })
        .then(function () { try { localStorage.removeItem('ll-tok:' + S.aid); localStorage.removeItem('ll-folder:' + S.aid); localStorage.removeItem('ll-libfile:' + S.aid); localStorage.removeItem('ll-sizes:' + S.aid); } catch (e) {} });
      if (S.token && window.google && window.google.accounts) try { window.google.accounts.oauth2.revoke(S.token, function () {}); } catch (e) {}
    }
    p.then(function () { S.acct = null; S.token = null; S.tokenExp = 0; lsSet('ll-acct', null); showGate(); });
  }
  function showGate() {
    $('#gate').hidden = false;
    var ok = !!clientId(); $('#g-signin').disabled = !ok; $('#g-setup-note').hidden = ok;
  }
  $('#g-signin').addEventListener('click', googleSignIn);
  $('#g-local').addEventListener('click', function () { start({ mode: 'local', name: 'This device', email: '' }); });

  function start(acct, carryLocal) {
    S.acct = acct; S.aid = acct.mode === 'google' ? acct.email : 'local';
    lsSet('ll-acct', acct);
    if (acct.mode === 'google' && !S.token) { var tk = lsGet('ll-tok:' + acct.email, null); if (tk && tk.e > now()) { S.token = tk.t; S.tokenExp = tk.e; } else S.needAuth = true; }
    S.local = lsGet('ll-sizes:' + S.aid, {}) || {};
    return DB.get('kv', libKey()).then(function (s) {
      S.lib = s ? JSON.parse(s) : newLib();
      if (!S.lib.settings) S.lib.settings = newLib().settings;
      if (carryLocal) S.lib = mergeLib(S.lib, carryLocal);
      $('#gate').hidden = true;
      S.disc.loaded = false;
      au.playbackRate = set().speed;
      show(S.view || 'home');
      if (acct.mode === 'google') { if (S.token) { S.needAuth = false; syncNow().then(retryUploads); } else { S.sync = 'auth'; render(); } }
      return DB.keys('blobs').then(function (ks) { // reconcile device audio list
        var have = {}; ks.forEach(function (k) { have[k] = 1; });
        Object.keys(S.local).forEach(function (k) { if (!have[k]) delete S.local[k]; });
        saveSizes();
      });
    });
  }

  /* ================= Boot ================= */
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  var saved = lsGet('ll-acct', null);
  if (saved && saved.mode) start(saved).catch(function (e) { console.error(e); showGate(); });
  else showGate();
  window.__LL = S; // for troubleshooting from the browser console
})();

</script>
</body>
