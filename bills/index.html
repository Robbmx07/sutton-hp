<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bill Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17201D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:center}
.gate-card h2{font-size:22px}
.gate-card p{margin:0}
</style>
<title>Sutton Bill Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first checkbook register — sticky header, one column of tear-off date stubs, fixed bottom tabs; two columns on wide screens */
:root{
  --paper:#F2F5F2; --card:#FFFFFF; --ink:#16211D; --muted:#5B6964; --line:#D9E1DB; --line-strong:#B9C6BE;
  --accent:#1D5B4E; --accent-ink:#FFFFFF; --accent-soft:#E0ECE6; --stub:#F6F1E2; --stub-ink:#5A4A1E;
  --due:#9A6510; --due-soft:#FBEFD6; --late:#B0261D; --late-soft:#FBE3DF; --ok:#25734A; --ok-soft:#DFF0E5;
  --in:#2B8A57; --in-soft:#DCF0E3; --out:#B8612A; --out-soft:#F7E6D9;
  --shadow:0 1px 2px rgba(22,33,29,.06),0 4px 14px rgba(22,33,29,.06); --scrim:rgba(14,22,19,.45);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1614; --card:#17201D; --ink:#E4ECE8; --muted:#97A7A0; --line:#27332F; --line-strong:#3A4843;
  --accent:#6BC2A8; --accent-ink:#0B1714; --accent-soft:#1B322C; --stub:#2A2617; --stub-ink:#E7D49C;
  --due:#E7AC4C; --due-soft:#382C14; --late:#F28A80; --late-soft:#3C1C19; --ok:#6CC58F; --ok-soft:#183124;
  --in:#6CC58F; --in-soft:#183124; --out:#E89A63; --out-soft:#3A2516;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1614; --card:#17201D; --ink:#E4ECE8; --muted:#97A7A0; --line:#27332F; --line-strong:#3A4843;
  --accent:#6BC2A8; --accent-ink:#0B1714; --accent-soft:#1B322C; --stub:#2A2617; --stub-ink:#E7D49C;
  --due:#E7AC4C; --due-soft:#382C14; --late:#F28A80; --late-soft:#3C1C19; --ok:#6CC58F; --ok-soft:#183124;
  --in:#6CC58F; --in-soft:#183124; --out:#E89A63; --out-soft:#3A2516;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 10px);opacity:.25}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.on{background:var(--ok)} .dot.warn{background:var(--due)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--card);
  border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* main */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:860px){.grid2{grid-template-columns:1.15fr .85fr;align-items:start}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{font-size:17px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.banner{border:1px dashed var(--line-strong);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--card)}
.banner.warn{border-color:var(--due);background:var(--due-soft)}

/* hero summary */
.hero{display:flex;flex-direction:column;gap:4px}
.hero .big{font-family:var(--f-display);font-size:clamp(26px,6vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .big .num{font-family:var(--f-num);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-num);font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--muted)}

/* attention */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;border-radius:10px;padding:10px 12px;border:1px solid var(--line);background:var(--card)}
.alert .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.alert.late .ic{background:var(--late-soft);color:var(--late)}
.alert.due .ic{background:var(--due-soft);color:var(--due)}
.alert.info .ic{background:var(--accent-soft);color:var(--accent)}
.alert .tx{flex:1;min-width:0}
.alert .tx b{display:block;font-weight:600}
.alert .tx span{font-size:13px;color:var(--muted)}
.alert .acts{display:flex;flex-direction:column;gap:4px;align-items:stretch;flex:none}
.alert .acts .ghost{color:var(--muted);font-weight:600}

/* register rows */
.reg{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.reg .row:first-child{border-top:0}
button.row:hover .nm{color:var(--accent)}
.stub{flex:none;width:50px;border-radius:8px;background:var(--stub);color:var(--stub-ink);text-align:center;padding:5px 0 6px;
  border-left:2px dashed color-mix(in srgb,var(--stub-ink) 35%,transparent);line-height:1}
.stub small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stub b{display:block;font-family:var(--f-num);font-size:19px;font-weight:600;margin-top:2px}
.stub.late{background:var(--late-soft);color:var(--late)} .stub.soon{background:var(--due-soft);color:var(--due)}
.stub.paid{background:var(--ok-soft);color:var(--ok)}
.stub.inc{background:var(--in-soft);color:var(--in);border-left-color:color-mix(in srgb,var(--in) 45%,transparent)}
.amt b.plus{color:var(--in)} .row.incrow .nm{color:var(--in)}
.chip.in{background:var(--in-soft);color:var(--in)}
.cal .pip.inc{background:var(--in)}
/* money in vs out */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.flow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.flow b{font-family:var(--f-num);font-size:clamp(17px,4.6vw,22px);font-weight:600;white-space:nowrap}
.flow span{font-size:12px;color:var(--muted)}
.flow .in b{color:var(--in)} .flow .out b{color:var(--out)} .flow .neg b{color:var(--late)}
.split{height:10px;border-radius:6px;background:var(--in-soft);overflow:hidden;margin-top:12px;display:flex}
.split i{display:block;height:100%;background:var(--out)}
.cf{width:100%;height:auto;display:block}
.cf text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.cf .lbl{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.legend i.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
/* paycheck planner */
.pc{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pc:first-child{border-top:0}
.pc .mid b{display:block;font-weight:600}
.pc .mid span{font-size:12.5px;color:var(--muted)}
.pc .left{text-align:right}
.pc .left b{font-family:var(--f-num);font-weight:600;display:block}
.pc .left small{font-size:11.5px;color:var(--muted)}
.pc .left.neg b{color:var(--late)} .pc .left.pos b{color:var(--in)}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .amt{text-align:right;flex:none}
.row .amt b{font-family:var(--f-num);font-weight:600;display:block}
.row .amt small{font-size:11.5px;color:var(--muted)}
.row.done .nm,.row.done .amt b{color:var(--muted)} .row.done .amt b{text-decoration:line-through}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.due{background:var(--due-soft);color:var(--due)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.plain{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.group-h{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;display:flex;justify-content:space-between}
.group-h:first-child{margin-top:0}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px}
.bar .track{grid-column:1/-1;height:8px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}

/* paycheck */
.pay2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybox{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.paybox b{font-family:var(--f-num);font-size:20px;font-weight:600;display:block}
.paybox span{font-size:12.5px;color:var(--muted)}

/* variable bills */
.var{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.var:first-child{border-top:0}
.var svg{width:110px;height:34px;display:block}

/* toolbar / filters */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;padding:3px;background:var(--card);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.search{flex:1;min-width:160px;border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;background:var(--card)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal .cell{min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left}
.cal .cell.out{opacity:.4}
.cal .cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .cell.sel{background:var(--accent-soft)}
.cal .cell .d{font-family:var(--f-num);font-size:12px;font-weight:600}
.cal .cell .tot{font-family:var(--f-num);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .pips{display:flex;gap:2px;flex-wrap:wrap}
.cal .pip{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal .pip.late{background:var(--late)} .cal .pip.paid{background:var(--ok)}
@media (max-width:480px){.cal .cell .tot{display:none}.cal .cell{min-height:46px}}

/* review */
.sub-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.sub-card:first-child{border-top:0}
.verdict{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.verdict button{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.verdict button[aria-pressed="true"].keep{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.verdict button[aria-pressed="true"].unsure{background:var(--due-soft);border-color:var(--due);color:var(--due)}
.verdict button[aria-pressed="true"].drop{background:var(--late-soft);border-color:var(--late);color:var(--late)}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lbl{font-size:13px;font-weight:600}
.f .hint{font-size:12px;color:var(--muted)}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=url],.f select,.f textarea{
  border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--card);width:100%;min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.err{color:var(--late);font-size:13px;font-weight:600}
.warnbox{border:1px solid var(--due);background:var(--due-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.picks button{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.picks button:hover{border-color:var(--accent);color:var(--accent)}
.amtwrap{position:relative}
.amtwrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-num)}
.amtwrap input{padding-left:26px!important;font-family:var(--f-num)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:4px}
.actions .spacer{flex:1}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet-panel{background:var(--card);width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;
  border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:16px;max-height:88%}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-16px;background:var(--card);padding-block:6px;z-index:1}
.sheet-h h2{font-size:19px;flex:1}
.x{border:0;background:var(--accent-soft);color:var(--accent);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}

.imp{display:flex;flex-direction:column}
.imp-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.imp-row:first-child{border-top:0}
.imp-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px}
.imp-row .nm{font-weight:600}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--late);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.tabs button{position:relative}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);

<script>
/* Sutton Bill Book, phone edition: stores data in the household Google Sheet instead of Claude.
   Gives the app the same small data/user/download interface it uses inside Claude. */
(function () {
  const API_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';
  const LS = { pass: 'sbb-pass', who: 'sbb-who', outbox: 'sbb-outbox', cache: 'sbb-cache' };
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  let PASS = get(LS.pass) || '', ME = get(LS.who) || '';

  /* ---------- talking to the sheet ---------- */
  async function api(body) {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, body, { passcode: PASS })) });
    let j; try { j = await r.json(); } catch (e) { const err = new Error('bad_response'); err.code = 'unavailable'; throw err; }
    if (!j.ok) { const err = new Error(j.error || 'error'); err.code = j.error === 'bad_passcode' || j.error === 'locked' ? j.error : 'unavailable'; err.until = j.until; throw err; }
    return j;
  }

  /* ---------- local copy + outbox (changes save even with a weak signal) ---------- */
  let server = {}, store = {}, loaded = false, flushing = false, gen = 0, again = false, syncErr = false;
  const subs = new Set();
  let outbox = []; try { outbox = JSON.parse(get(LS.outbox) || '[]') || []; } catch (e) { outbox = []; }
  const saveOutbox = () => put(LS.outbox, JSON.stringify(outbox));
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (t, src) => { const o = isObj(t) ? Object.assign({}, t) : {}; for (const k in src) o[k] = isObj(src[k]) && isObj(o[k]) ? merge(o[k], src[k]) : src[k]; return o; };
  const clone = v => JSON.parse(JSON.stringify(v));
  const applyOp = (st, o) => { const c = (st[o.c] = st[o.c] || {}); if (o.op === 'delete') delete c[o.id]; else if (o.op === 'update') c[o.id] = merge(c[o.id], o.data); else c[o.id] = clone(o.data); };
  const rebuild = () => { store = clone(server); outbox.forEach(o => applyOp(store, o)); };
  const col = c => (store[c] = store[c] || {});
  const notify = () => subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  const snapOf = (c, id) => { const d = col(c)[id]; return { id, exists: d !== undefined, data: () => d, metadata: { fromCache: false, hasPendingWrites: outbox.length > 0 } }; };
  let flushTimer = null;
  function flushSoon() { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 250); }
  async function flush() {
    if (flushing || !outbox.length) return;
    flushing = true;
    try {
      while (outbox.length) {
        const n = Math.min(outbox.length, 150), ops = outbox.slice(0, n);
        await api({ action: 'write', ops });
        ops.forEach(o => applyOp(server, o));
        outbox.splice(0, n); saveOutbox(); gen++;
        notify();
      }
      syncErr = false;
    } catch (e) {
      syncErr = true; flushing = false;
      if (e && (e.code === 'bad_passcode' || e.code === 'locked')) { needPass(e); return; }
      setTimeout(flush, 15000); notify(); return;
    }
    flushing = false; notify();
  }
  function send(ops) { ops.forEach(o => { outbox.push(o); applyOp(store, o); }); saveOutbox(); notify(); flushSoon(); return Promise.resolve(); }
  let refreshing = null;
  async function refresh() {
    if (!loaded) return;
    if (refreshing) { again = true; return refreshing; }
    refreshing = (async () => {
      const g = gen;
      const j = await api({ action: 'load' });
      if (g !== gen) { again = true; return; }
      server = j.data || {}; put(LS.cache, JSON.stringify(server)); rebuild(); notify(); flush();
    })().finally(() => { refreshing = null; if (again) { again = false; setTimeout(() => refresh().catch(() => {}), 300); } });
    return refreshing;
  }
  function docRef(c, id) {
    return { id, path: c + '/' + id,
      get: async () => snapOf(c, id),
      set: data => send([{ op: 'set', c, id, data }]),
      update: data => send([{ op: 'update', c, id, data }]),
      delete: () => send([{ op: 'delete', c, id }]),
      onSnapshot(next) { const fn = () => next(snapOf(c, id)); subs.add(fn); if (loaded) setTimeout(fn, 0); return () => subs.delete(fn); } };
  }
  const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function query(c, ord, lim) {
    const run = () => {
      let docs = Object.keys(col(c)).map(id => snapOf(c, id));
      if (ord) { const [f, dir] = ord; docs.sort((x, y) => { const a = x.data()[f], b = y.data()[f]; const r = a === undefined ? 1 : b === undefined ? -1 : (a < b ? -1 : a > b ? 1 : 0); return dir === 'desc' ? -r : r; }); }
      if (lim) docs = docs.slice(0, lim);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {} };
    };
    return { orderBy: (f, dir) => query(c, [f, dir || 'asc'], lim), limit: n => query(c, ord, Math.max(n, 5000)), get: async () => run(), where: () => query(c, ord, lim),
      doc: id => docRef(c, id || newId()), add: async data => { const r = docRef(c, newId()); await r.set(data); return r; },
      onSnapshot(next) { const fn = () => next(run()); subs.add(fn); if (loaded) setTimeout(fn, 0); return () => subs.delete(fn); } };
  }
  const DB = Object.freeze({ doc: p => { const i = p.lastIndexOf('/'); return docRef(p.slice(0, i), p.slice(i + 1)); }, collection: c => query(c) });

  const USER = Object.freeze({
    id: async () => ME || null, me: async () => ({ id: ME || null, name: ME || '', email: null, isOwner: true, canEdit: true, avatarUrl: '', color: '#1D5B4E' }),
    isOwner: async () => true, canEdit: async () => true, can: async () => true, name: async () => ME || '',
    profiles: async ids => { const o = {}; [].concat(ids).forEach(id => { o[id] = { id, name: id || '', isMe: !!ME && id === ME, guest: false, email: null, avatarUrl: '', color: '#1D5B4E' }; }); return o; },
    search: async () => []
  });
  /* a real download, which works on GitHub Pages */
  const DOWNLOADS = Object.freeze({ save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } });

  /* ---------- passcode and who's-this-phone screens ---------- */
  let resolveReady; const ready = new Promise(r => { resolveReady = r; });
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function overlay(html) {
    let el = document.getElementById('sbbGate');
    if (!html) { if (el) el.remove(); document.body.classList.remove('locked'); return; }
    if (!el) { el = document.createElement('div'); el.id = 'sbbGate'; el.className = 'gate'; document.body.appendChild(el); }
    el.innerHTML = `<div class="gate-card">${html}</div>`; document.body.classList.add('locked');
    return el;
  }
  function needPass(e) {
    PASS = ''; put(LS.pass, null);
    const msg = e && e.code === 'locked' ? `Too many wrong tries. The bill book is locked until ${new Date(e.until).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}.`
      : e && e.code === 'bad_passcode' ? 'That passcode didn’t match. Try again.' : '';
    const el = overlay(`<h2>Sutton Bill Book</h2><p class="small muted">Enter the household passcode. This phone will remember it.</p>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
      <form id="sbbPassForm" class="form"><input id="sbbPass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Passcode" aria-label="Household passcode" style="text-align:center;font-size:20px;letter-spacing:.3em;border:1px solid var(--line-strong);border-radius:10px;padding:12px;background:var(--card);width:100%">
      <button class="btn primary" type="submit" style="width:100%">Unlock</button></form>`);
    el.querySelector('#sbbPassForm').onsubmit = ev => { ev.preventDefault(); const v = el.querySelector('#sbbPass').value.trim(); if (!v) return; PASS = v; put(LS.pass, v); start(); };
    setTimeout(() => { const i = el.querySelector('#sbbPass'); if (i) i.focus(); }, 60);
  }
  function askWho() {
    const st = (store.meta && store.meta.settings) || {}, names = (st.members && st.members.filter(Boolean).length ? st.members : ['Robert', 'Erica']).filter(Boolean);
    const el = overlay(`<h2>Who’s using this phone?</h2><p class="small muted">Bills you mark paid are labeled with your name.</p>
      <div class="form">${names.map(n => `<button class="btn" data-who="${esc(n)}" style="width:100%;min-height:52px;font-size:17px">I’m ${esc(n)}</button>`).join('')}</div>`);
    el.querySelectorAll('[data-who]').forEach(b => b.onclick = () => { ME = b.dataset.who; put(LS.who, ME); overlay(null); resolveReady(); if (typeof S === 'object') { S.me = ME; } if (typeof render === 'function') render(); });
  }
  let started = false;
  async function start() {
    if (!API_URL || API_URL.indexOf('script.google.com') < 0) {
      overlay(`<h2>Almost set up</h2><p class="small">This copy isn’t connected to your Google Sheet yet. Paste the Apps Script web app address into <code>API_URL</code> in index.html (see SETUP.md).</p>`); return;
    }
    if (!PASS) { needPass(); return; }
    overlay(`<h2>Sutton Bill Book</h2><p class="small muted">Opening your bills…</p>`);
    try {
      const j = await api({ action: 'load' });
      server = j.data || {}; put(LS.cache, JSON.stringify(server));
    } catch (e) {
      if (e && (e.code === 'bad_passcode' || e.code === 'locked')) { needPass(e); return; }
      /* no signal: open the last copy this phone saw and keep retrying */
      let cached = null; try { cached = JSON.parse(get(LS.cache) || 'null'); } catch (x) {}
      if (!cached) { overlay(`<h2>Can’t reach the bill book</h2><p class="small">Check your connection. It will try again in a few seconds.</p>`); setTimeout(start, 8000); return; }
      server = cached;
    }
    rebuild(); loaded = true; notify(); flush();
    if (!started) {
      started = true;
      const poll = () => { if (!document.hidden) refresh().catch(e => { if (e && (e.code === 'bad_passcode' || e.code === 'locked')) needPass(e); }); };
      setInterval(poll, 20000); document.addEventListener('visibilitychange', poll); window.addEventListener('focus', poll);
    }
    if (!ME) { askWho(); return; }
    overlay(null); resolveReady();
  }

  window.SBB = Object.freeze({
    pending: () => outbox.length,
    switchWho: () => { ME = ''; put(LS.who, null); askWho(); },
    lock: () => { PASS = ''; put(LS.pass, null); needPass(); }
  });
  window.claude = Object.freeze({ use: async name => {
    if (name === 'db') { await ready; return DB; }
    if (name === 'user') { await ready; return USER; }
    if (name === 'downloads') return DOWNLOADS;
    return null;
  } });
  window.addEventListener('DOMContentLoaded', start);
})();

</script>

<script>
/*LOGIC-START*/
const DAY = 864e5;
const pad = n => String(n).padStart(2, '0');
const ord = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const iso = n => new Date(n * DAY).toISOString().slice(0, 10);
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
function localToday() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function addMonths(s, k) {
  const [y, m, d] = s.split('-').map(Number);
  const t = (m - 1) + k, ny = y + Math.floor(t / 12), nm = ((t % 12) + 12) % 12 + 1;
  return `${ny}-${pad(nm)}-${pad(Math.min(d, dim(ny, nm)))}`;
}
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(ord(s)) && iso(ord(s)) === s;
const round2 = n => Math.round(n * 100) / 100;

const FREQ = {
  weekly:     { d: 7,  pm: 52 / 12, label: 'Weekly' },
  biweekly:   { d: 14, pm: 26 / 12, label: 'Every 2 weeks' },
  monthly:    { m: 1,  pm: 1,       label: 'Monthly' },
  bimonthly:  { m: 2,  pm: 1 / 2,   label: 'Every 2 months' },
  quarterly:  { m: 3,  pm: 1 / 3,   label: 'Every 3 months' },
  semiannual: { m: 6,  pm: 1 / 6,   label: 'Every 6 months' },
  yearly:     { m: 12, pm: 1 / 12,  label: 'Yearly' },
  once:       { once: true, pm: 0,  label: 'One time' }
};

/* Every due date of a bill inside [from, to]. The anchor is the first due date; months clamp to the month's last day. */
function occurrences(b, from, to) {
  const out = [];
  if (!b || !isDate(b.anchor) || !isDate(from) || !isDate(to)) return out;
  const f = FREQ[b.freq] || FREQ.monthly, A = ord(b.anchor), F = ord(from), T = ord(to);
  let end = isDate(b.endDate) ? ord(b.endDate) : Infinity;
  if (b.status === 'cancelled') end = Math.min(end, isDate(b.cancelledOn) ? ord(b.cancelledOn) - 1 : -Infinity);
  if (b.status === 'paused') end = Math.min(end, isDate(b.pausedOn) ? ord(b.pausedOn) - 1 : -Infinity);
  const hi = Math.min(T, end);
  if (hi < F) return out;
  if (f.once) { if (A >= F && A <= hi) out.push(b.anchor); return out; }
  if (f.d) { const k = Math.max(0, Math.ceil((F - A) / f.d)); for (let n = A + k * f.d; n <= hi; n += f.d) out.push(iso(n)); return out; }
  const [ay, am] = b.anchor.split('-').map(Number), [fy, fm] = from.split('-').map(Number);
  let k = Math.max(0, Math.floor(((fy - ay) * 12 + (fm - am)) / f.m) - 1);
  for (let i = 0; i < 1000; i++, k++) {
    const s = addMonths(b.anchor, k * f.m), o = ord(s);
    if (o > hi) break;
    if (o >= F) out.push(s);
  }
  return out;
}
function nthDue(b, n) { const f = FREQ[b.freq] || FREQ.monthly; if (f.once) return b.anchor; return f.d ? iso(ord(b.anchor) + n * f.d) : addMonths(b.anchor, n * f.m); }
function nextDue(b, today) { return occurrences(b, today, iso(ord(today) + 800))[0] || null; }
/* Due dates of a bill around a window, looking backward from its anchor too (for matching past bank charges) */
function datesNear(b, from, to) {
  const f = FREQ[b.freq] || FREQ.monthly, out = [];
  if (!isDate(b.anchor)) return out;
  if (f.once) return b.anchor >= from && b.anchor <= to ? [b.anchor] : [];
  for (let k = -60; k <= 60; k++) { const d = nthDue(b, k); if (d >= from && d <= to) out.push(d); }
  return out;
}
function nearestDue(b, date, maxDays) {
  const ds = datesNear(b, iso(ord(date) - maxDays), iso(ord(date) + maxDays));
  return ds.length ? ds.reduce((x, y) => Math.abs(ord(y) - ord(date)) < Math.abs(ord(x) - ord(date)) ? y : x) : null;
}
/* A bank charge matches a bill already in the book when it lands within a few days of a due date at a similar amount,
   even if the bank's name for it ("SPECTRUM", "MR COOPER") differs from yours ("TWC", "Mortgage"). */
/* The due date a bank charge most likely paid: the first due date no more than 10 days before the charge
   (paid late) and otherwise the next one coming up (paid early). */
function dueForCharge(b, date) {
  const f = FREQ[b.freq] || FREQ.monthly, per = f.d || (f.m || 1) * 31;
  return datesNear(b, iso(ord(date) - 10), iso(ord(date) + Math.min(per, 45)))[0] || null;
}
/* A bank charge series matches a bill already in the book when its charges land near that bill's due dates at a
   similar amount, even if the bank's name ("SPECTRUM", "MR COOPER") differs from yours ("TWC", "Mortgage").
   A clear category clash (internet vs. utility) rules a match out. */
function scheduleMatch(existing, freq, list, used, bankName) {
  const last = list[list.length - 1], cat = guessCategory(bankName || '').category;
  let best = null, bestScore = Infinity;
  for (const b of existing) {
    if (b.status !== 'active' || used.has(b.id)) continue;
    if (b.freq !== freq && !(FREQ[b.freq].m && FREQ[freq].m && FREQ[b.freq].m === FREQ[freq].m)) continue;
    if (cat !== 'Other' && b.category && b.category !== 'Other' && b.category !== cat) continue;
    const dist = list.map(t => { const d = dueForCharge(b, t.date); return d ? ord(d) - ord(t.date) : null; }).filter(d => d !== null && d <= 14);
    if (dist.length < Math.ceil(list.length * 0.6)) continue;
    const a = Number(b.amount) || 0;
    const diff = a > 0 ? Math.abs(last.amt - a) / Math.max(a, last.amt) : 0.5;
    if (diff > (b.amountType === 'varies' ? 0.6 : 0.2)) continue;
    /* a fixed bill (a loan) only matches charges that hold steady, not a store you visit monthly */
    if (b.amountType !== 'varies') {
      let moves = 0; for (let i = 1; i < list.length; i++) if (Math.abs(list[i].amt - list[i - 1].amt) / list[i - 1].amt > 0.03) moves++;
      if (moves > (list.length > 4 ? 2 : 1)) continue;
    }
    const score = diff * 3 + avg(dist.map(Math.abs)) / 30 + (list.length - dist.length) * 0.1;
    if (score < bestScore) { best = b; bestScore = score; }
  }
  return best;
}
const payId = (billId, date) => `${billId}_${date}`;
const isInc = b => !!b && b.kind === 'income';
const isSpend = b => !!b && b.kind === 'spending';
const periodDays = b => (FREQ[b.freq] || FREQ.weekly).d || Math.round(((FREQ[b.freq] || FREQ.monthly).m || 1) * 30.44);
/* The start of the spending period (week) a purchase falls in */
function periodStart(b, date) { const ds = datesNear(b, iso(ord(date) - periodDays(b) - 1), date); return ds.length ? ds[ds.length - 1] : null; }
const SPEND_CATS = [
  [/\bfuel\b|shell|speedway|\bbp\b|marathon|sunoco|circle k|exxon|mobil|sunoco|casey'?s|murphy|valero|citgo|gas station/i, 'Gas & Fuel', 'gas'],
  [/mcdonald|taco bell|wendy|burger king|chick|chipotle|panera|pizza|grubhub|doordash|uber ?eats|subway|perkins|restaurant|grill|diner|cafe|coffee|starbucks|dunkin|wings|chinese|famous recipe|kfc|arby|skyline|gold star/i, 'Dining out', 'dining out'],
  [/kroger|meijer|aldi|wal ?-?mart|sam'?s club|costco|target|publix|whole foods|trader joe|food lion|giant eagle|dorothy lane|jungle jim|save a lot|grocery|market/i, 'Groceries', 'groceries']
];
function guessSpend(name) { for (const [re, cat, label] of SPEND_CATS) if (re.test(name)) return { category: cat, label }; return null; }

  const F = [['all', 'All bills'], ['bill', 'Bills'], ['subscription', 'Subscriptions'], ['income', 'Income'], ['spending', 'Spending'], ['varies', 'Amount varies'], ['autopay', 'Autopay'], ['inactive', 'Paused & cancelled']];
  const q = nameKey(S.q);
  let list = c.bills.filter(b => {
    if (S.filter === 'inactive') { if (b.status === 'active') return false; } else if (b.status !== 'active') return false;
    if (S.filter === 'income' ? !isInc(b) : S.filter !== 'inactive' && isInc(b)) return false;
    if (S.filter === 'spending' ? !isSpend(b) : S.filter !== 'inactive' && S.filter !== 'all' && isSpend(b)) return false;
    if (S.filter === 'bill' && b.kind !== 'bill') return false;
    if (S.filter === 'subscription' && b.kind !== 'subscription') return false;
    if (S.filter === 'varies' && b.amountType !== 'varies') return false;
    if (S.filter === 'autopay' && !b.autopay) return false;

    return true;

  list.sort((x, y) => (x.n || '9999') < (y.n || '9999') ? -1 : (x.n || '9999') > (y.n || '9999') ? 1 : x.b.name.localeCompare(y.b.name));
  const sumM = list.reduce((s, x) => s + perMonth(x.b, c.est.get(x.b.id), c.t), 0);

    <section class="panel"><div class="panel-h"><h2>${list.length} ${S.filter === 'inactive' ? 'paused or cancelled' : 'active'}</h2>${S.filter !== 'inactive' ? `<span class="num small muted" style="${S.filter === 'income' ? 'color:var(--in)' : ''}">${S.filter === 'income' ? '+' : ''}${money(sumM)}/mo</span>` : ''}${S.filter === 'income' ? '<button class="btn sm" data-act="add-income">+ Add income</button>' : ''}</div>
    <div class="reg">${list.map(({ b, n }) => {
      const e = c.est.get(b.id), f = FREQ[b.freq] || FREQ.monthly;
      return `<button class="row" data-act="edit:${esc(b.id)}">${n ? stub(n, ord(n) - c.T <= (+S.settings.leadDays || 3) ? 'soon' : '') : `<div class="stub"><small>—</small><b>·</b></div>`}
        <span class="mid"><span class="nm">${esc(b.name)}</span><span class="sub"><span>${esc(b.category || 'Other')}</span><span>· ${f.label}</span>${b.autopay ? '<span class="chip plain">Autopay</span>' : ''}${b.amountType === 'varies' ? '<span class="chip plain">Varies</span>' : ''}${b.status !== 'active' ? `<span class="chip ${b.status === 'cancelled' ? 'late' : 'due'}">${b.status === 'cancelled' ? 'Cancelled' : 'Paused'}</span>` : ''}</span></span>
        <span class="amt"><b class="${isInc(b) ? 'plus' : ''}">${isInc(b) ? '+' : ''}${b.amountType === 'varies' ? '~' : ''}${money(e)}</b><small>${f.once ? 'one time' : f.label.toLowerCase()}</small></span></button>`;
    }).join('') || '<p class="muted">No bills match.</p>'}</div></section>`;
}
function renderReview(c) {

  const unsure = subs.filter(x => x.b.verdict === 'unsure' || x.b.verdict === 'drop');

    <div class="big"><span class="num">${money0(totalY)}</span><span class="muted" style="font-size:.5em;font-weight:600"> a year on ${subs.length} subscription${subs.length === 1 ? '' : 's'}</span></div>
    <span class="small muted">Go down the list and mark each one. Dropping the ones marked Unsure or Cancel would save <b class="num">${money0(unsureY)}</b> a year.</span></section>`;
  if (!subs.length) html += `<section class="panel empty"><h3>No subscriptions yet</h3><p>Add streaming, cloud storage, game passes and memberships as subscriptions to review them here.</p><button class="btn" data-act="add">Add a subscription</button></section>`;

    const days = isDate(b.reviewedOn) ? c.T - ord(b.reviewedOn) : null;

      <div class="small muted">${esc(b.category || 'Other')} · ${days == null ? 'never reviewed' : days === 0 ? 'reviewed today' : `reviewed ${days} days ago`}${isDate(b.trialEnds) && b.trialEnds >= c.t ? ` · trial ends ${short(b.trialEnds)}` : ''}</div></div>
      <div class="amt" style="text-align:right"><b class="num">${money0(y)}</b><div class="small muted">a year</div></div>
      <div class="verdict" role="group" aria-label="Verdict for ${esc(b.name)}">
        <button class="keep" data-act="verdict:${esc(b.id)}:keep" aria-pressed="${b.verdict === 'keep'}">Keep</button>
        <button class="unsure" data-act="verdict:${esc(b.id)}:unsure" aria-pressed="${b.verdict === 'unsure'}">Unsure</button>
        <button class="drop" data-act="verdict:${esc(b.id)}:drop" aria-pressed="${b.verdict === 'drop'}">Cancel it</button>
        ${b.verdict === 'drop' ? `<button class="btn sm primary" data-act="cancel:${esc(b.id)}">I cancelled it</button>${b.payUrl ? `<a class="btn sm" href="${esc(b.payUrl)}" target="_blank" rel="noopener">Open account page</a>` : ''}` : ''}
      </div></div>`;
  }).join('')}</section>`;
  html += `<section class="panel"><div class="panel-h"><h2>Cancelled</h2><span class="small muted">${money0(T.savedSoFar)} saved so far</span></div>${cancelled.length ? `<div class="reg">${cancelled.map(b => {
      const m = c.est.get(b.id) * (FREQ[b.freq] || FREQ.monthly).pm;
      return `<button class="row" data-act="edit:${esc(b.id)}"><span class="mid"><span class="nm">${esc(b.name)}</span><span class="sub">Cancelled ${isDate(b.cancelledOn) ? short(b.cancelledOn) : ''}</span></span><span class="amt"><b>${money0(m * 12)}</b><small>a year saved</small></span></button>`;
    }).join('')}</div>` : '<p class="small muted">Bills you cancel move here, with what they save you.</p>'}</section>`;
  return html;
}

function render() {

  $('#addBtn').disabled = S.readOnly || S.mode === 'loading';
  if (S.mode === 'loading' || (S.mode === 'shared' && !(S.loaded.bills && S.loaded.pays))) {
    view.innerHTML = `<div class="panel empty"><h3>Opening your bill book…</h3><p>Your bills, due dates and subscriptions will show here.</p></div>`; return;
  }
  const c = ctx();
  const late = c.inst.filter(i => i.state === 'overdue').length;
  const badge = $('#lateBadge'); badge.hidden = !late; badge.textContent = late;
  let html = '';
  if (S.mode === 'device') html += `<div class="banner warn small"><span>Saved in this browser only. Open this page from your Claude app to share it between phones.</span></div>`;
  const focusQ = document.activeElement && document.activeElement.id === 'q';
  const pos = focusQ ? document.activeElement.selectionStart : 0;
  html += S.tab === 'upcoming' ? renderUpcoming(c) : S.tab === 'bills' ? renderBills(c) : S.tab === 'review' ? renderReview(c) : S.tab === 'more' ? renderMore(c) : renderHome(c);
  view.innerHTML = html;
  if (focusQ) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
  resolveNames();
}
async function resolveNames() {
  const els = [...document.querySelectorAll('[data-uid]')]; if (!els.length || !S.user) return;
  try {
    const ids = [...new Set(els.map(e => e.dataset.uid))], ps = await S.user.profiles(ids);
    els.forEach(e => { const p = ps[e.dataset.uid]; e.textContent = p && p.isMe ? 'you' : (p && p.name ? p.name.split(' ')[0] : ''); });
  } catch (e) {}
}

let toastT = null;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`; t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, undo ? 6000 : 3600);
}

    showImport('calendar', icsCandidates(evs, localToday(), [...S.bills.values()].filter(b => b.status !== 'cancelled'), S.settings.members));
  } catch (err) { toast('Couldn\u2019t read that file. Try exporting it again.'); }

      if (missing.length && !body.dataset.warned) {
        body.dataset.warned = '1';
        body.querySelector('#impMsg').innerHTML = `<div class="warnbox">${missing.map(([c]) => esc(c.name)).join(', ')} ${missing.length === 1 ? 'has' : 'have'} no amount. Enter one, or tap again to add ${missing.length === 1 ? 'it' : 'them'} as “amount varies” and fill it in when the bill comes.</div>`;
        return;
      }
      const go = body.querySelector('#impGo'); go.disabled = true; go.textContent = 'Saving…';
      const hist = source === 'bank' || (body.querySelector('#impHist') && body.querySelector('#impHist').checked);
      const today = localToday(); let added = 0, updated = 0;
      for (const [c] of sel) {
        const i = cs.indexOf(c);
        const name = body.querySelector('#in' + i).value.trim() || c.name;
        const amt = round2(parseFloat(body.querySelector('#ia' + i).value) || 0);
        const hasHist = hist && c.history.some(h => h.amount > 0);
        let b;
        if (c.section === 'spend') {
          if (c.existing && S.bills.get(c.existing.id)) { b = structuredClone(S.bills.get(c.existing.id)); if (amt > 0) b.amount = amt; updated++; }
          else { b = { id: uid(), name, kind: 'spending', category: c.category, amount: amt || c.amount, amountType: 'varies', freq: c.freq, anchor: c.anchor, endDate: null, autopay: false, owner: '', payUrl: '', notes: '',
            match: c.match || '', exclude: c.exclude || '', status: 'active', createdOn: today, trackFrom: c.history.length ? c.history[0].date : today, createdBy: S.me || null, importedFrom: source }; added++; }
          if (!(await Store.putBill(b))) { go.disabled = false; go.textContent = 'Try again'; return; }
          /* the bank's weekly totals replace anything typed in for those weeks */
          for (const h of c.history) await Store.putPay({ id: payId(b.id, h.date), billId: b.id, dueDate: h.date, amount: h.amount, paidOn: h.date, by: null, source, loggedOn: today });
          continue;
        }
        if (c.existing && S.bills.get(c.existing.id)) {
          b = structuredClone(S.bills.get(c.existing.id));
          if (/\d/.test(b.name) || !b.name.trim()) b.name = name;
          if (amt > 0 && Math.abs(amt - (Number(b.amount) || 0)) > 0.004) {
            if (Number(b.amount) > 0 && b.amountType !== 'varies') b.priceHistory = [...(b.priceHistory || []), { on: today, from: Number(b.amount), amount: amt }].slice(-24);
            b.amount = amt;
          }
          if (c.varies && source !== 'bank') b.amountType = 'varies';
          else if (amt > 0 && b.amountType === 'varies' && !(Number(c.existing.amount) > 0)) b.amountType = 'fixed';
          if (!(b.priceHistory || []).length && (c.priceHistory || []).length) b.priceHistory = c.priceHistory.slice(-24);
          if (c.category && (!b.category || b.category === 'Other')) b.category = c.category;
          if (c.kind === 'subscription') b.kind = 'subscription';
          /* the bank's deposit schedule beats the calendar's (paid weekly, not every 2 weeks) */
          if (c.section === 'income' && source === 'bank' && c.history.length >= 3 && b.freq !== c.freq) { b.freq = c.freq; b.anchor = c.anchor; b.amount = amt || c.amount; }
          updated++;
        } else {
          b = { id: uid(), name, kind: c.kind, category: c.category, amount: amt, amountType: c.varies ? 'varies' : 'fixed', freq: c.freq, anchor: c.anchor,
            endDate: c.endDate || null, autopay: !!c.autopay, owner: '', payUrl: '', notes: source === 'bank' ? `Found in bank statement: ${c.sample || ''}`.trim() : '',
            status: 'active', createdOn: today, trackFrom: today, createdBy: S.me || null, priceHistory: (c.priceHistory || []).slice(-24), importedFrom: source };
          if (!(amt > 0) && !hasHist) b.amountType = 'varies';
          if (c.section === 'income') { b.kind = 'income'; b.category = 'Income'; b.autopay = false; b.amountType = 'varies'; }
          if (c.stale) { b.status = 'paused'; b.pausedOn = today; }
          added++;
        }
        if (!(await Store.putBill(b))) { go.disabled = false; go.textContent = 'Try again'; return; }
        const done = new Set();
        if (hasHist) for (const h of c.history.slice(-14)) {
          /* bank charges land a few days off the due date: file each under the due date it paid */
          const due = c.existing ? dueForCharge(b, h.date) : h.date;
          if (due && done.has(due)) continue;
          if (due) done.add(due);
          if (!due || S.pays.has(payId(b.id, due))) continue;
          await Store.putPay({ id: payId(b.id, due), billId: b.id, dueDate: due, amount: round2(h.amount), paidOn: h.date, by: null, source, loggedOn: today });
        }
      }
      closeSheet();
      toast([added ? `Added ${added} bill${added === 1 ? '' : 's'}` : '', updated ? `updated ${updated}` : ''].filter(Boolean).join(', ') || 'Nothing changed');
    };
  });
}

/* ---------- export / backup ---------- */
async function offerFile(filename, data, mime, intro) {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data: new Blob([data], { type: mime }) }); toast(`Saved ${filename}`); return; }
    catch (e) { if (e && (e.code === 'declined' || e.code === 'cancelled' || e.code === 'aborted')) return; }
  }
  openSheet(filename, `<div class="form"><p class="small muted" style="margin:0">${esc(intro)} Downloading isn\u2019t available here, so copy the text below and save it as <b>${esc(filename)}</b>.</p>
    <textarea class="code" id="fileText" readonly>${esc(data)}</textarea><div class="actions"><button class="btn primary" id="copyBtn">Copy</button></div></div>`, body => {
    body.querySelector('#copyBtn').onclick = async () => { const ta = body.querySelector('#fileText'); try { await navigator.clipboard.writeText(ta.value); toast('Copied'); } catch (e) { ta.focus(); ta.select(); toast('Selected. Use Copy from your keyboard or menu.'); } };
  });
}
function exportICS() {
  const c = ctx(); const act = c.bills.filter(b => b.status === 'active' && !isInc(b));
  if (!act.length) { toast('Add a bill first.'); return; }
  offerFile('bills.ics', buildICS(act, c.est, c.t, +S.settings.leadDays || 3, money), 'text/calendar', 'This is a calendar file for Google Calendar.');
}
function exportJSON() {
  const data = JSON.stringify({ app: 'sutton-bill-book', version: 1, exportedOn: localToday(), settings: S.settings, bills: [...S.bills.values()], payments: [...S.pays.values()] }, null, 1);
  offerFile(`bill-book-backup-${localToday()}.json`, data, 'application/json', 'This backup holds all your bills, payments and settings.');
}
function restoreBackup(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast('That isn\u2019t a bill book backup file.'); return; }
  if (!d || d.app !== 'sutton-bill-book' || !Array.isArray(d.bills)) { toast('That isn\u2019t a bill book backup file.'); return; }
  const bills = d.bills.filter(b => b && b.id && b.name && isDate(b.anchor)), pays = (d.payments || []).filter(p => p && p.id && p.billId);
  const newB = bills.filter(b => !S.bills.has(b.id)).length;
  openSheet('Restore backup', `<div class="form"><p>The backup from ${esc(d.exportedOn || 'an earlier date')} has <b>${bills.length}</b> bills (${newB} not in your book now) and <b>${pays.length}</b> payments.</p>
    <p class="small muted">Matching bills are replaced with the backup\u2019s version. Bills added since the backup are kept.</p>
    <div class="actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" id="doRestore">Restore</button></div></div>`, body => {
    body.querySelector('#doRestore').onclick = async () => {
      const go = body.querySelector('#doRestore'); go.disabled = true; go.textContent = 'Restoring…';
      for (const b of bills) if (!(await Store.putBill(b))) return;
      for (const p of pays) if (!(await Store.putPay(p))) return;
      if (d.settings) await Store.putSettings(Object.assign(structuredClone(DEFAULT_SETTINGS), d.settings));
      closeSheet(); toast('Backup restored');
    };
  });
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; try { localStorage.setItem('sbb.tab', S.tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
  const [a, x, y] = t.dataset.act.split(':');
  if (a === 'close') return closeSheet();
  if (a === 'add') return openBill(null);
  if (a === 'sbb-switch' && window.SBB) return window.SBB.switchWho();
  if (a === 'sbb-lock' && window.SBB) return window.SBB.lock();
  if (a === 'add-income') return openBill(null, { kind: 'income', category: 'Income', freq: 'biweekly', amountType: 'varies' });
  if (a === 'edit') { if (!$('#sheet').hidden) closeSheet(); return openBill(x); }
  if (a === 'pay') return openPay(x, y);
  if (a === 'tab') { S.tab = x; render(); window.scrollTo(0, 0); return; }
  if (a === 'upv') { S.upView = x; render(); return; }
  if (a === 'cal') { let m = S.calM + +x, yy = S.calY; if (m < 1) { m = 12; yy--; } if (m > 12) { m = 1; yy++; } S.calM = m; S.calY = yy; S.selDay = null; render(); return; }
  if (a === 'day') { S.selDay = x; render(); return; }
  if (a === 'filter') { S.filter = x; render(); return; }
  if (a === 'verdict') { if (S.readOnly) return; const b = structuredClone(S.bills.get(x)); if (!b) return; b.verdict = b.verdict === y ? null : y; b.reviewedOn = localToday(); await Store.putBill(b); return; }
  if (a === 'ack') {
    /* dismiss an alert; stored on the bill so it clears for both of you, and comes back only if something new happens */
    const [, kind, id, val] = t.dataset.act.split(':');
    const b = structuredClone(S.bills.get(id)); if (!b) return;
    const prev = structuredClone(b);
    if (kind === 'price') b.priceAck = val;
    else if (kind === 'renew') b.renewAck = val;
    else if (kind === 'trial') b.trialAck = val;
    else if (kind === 'log') b.logAck = val;
    else if (kind === 'dup') b.notDup = [...new Set([...(b.notDup || []), val])];
    if (await Store.putBill(b)) toast(kind === 'dup' ? 'Kept both' : 'Dismissed', () => Store.putBill(prev));
    return;
  }
  if (a === 'cancel') { const b = structuredClone(S.bills.get(x)); if (!b) return; const prev = structuredClone(b); b.status = 'cancelled'; b.cancelledOn = localToday(); if (await Store.putBill(b)) toast(`${b.name} cancelled. Savings are tracked under Cancelled.`, () => Store.putBill(prev)); return; }
  if (a === 'import-ics') return pick('ics');
  if (a === 'import-csv') return pick('csv');
  if (a === 'import-json') return pick('json');
  if (a === 'export-ics') return exportICS();
  if (a === 'export-json') return exportJSON();
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } if (e.target.id === 'payFreq') { const s = $('#paySemi'); if (s) s.hidden = e.target.value !== 'semimonthly'; } });
document.addEventListener('change', e => { if (e.target.id === 'payFreq') { const s = $('#paySemi'); if (s) s.hidden = e.target.value !== 'semimonthly'; } });
document.addEventListener('submit', async e => {
  if (e.target.id === 'payForm') {
    e.preventDefault();
    const pay = { enabled: $('#payOn').checked, freq: $('#payFreq').value, anchor: $('#payAnchor').value, d1: +$('#payD1').value || 1, d2: +$('#payD2').value || 15 };
    if (pay.enabled && pay.freq !== 'semimonthly' && !isDate(pay.anchor)) { toast('Pick a recent payday first.'); return; }
    if (await Store.putSettings(Object.assign({}, S.settings, { pay }))) toast('Paydays saved');
  }
  if (e.target.id === 'hhForm') {
    e.preventDefault();
    const s = Object.assign({}, S.settings, { members: [$('#m1').value.trim(), $('#m2').value.trim()], leadDays: +$('#lead').value || 3 });
    if (await Store.putSettings(s)) toast('Saved');
  }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
setInterval(() => { const t = localToday(); if (t !== S._day) { S._day = t; if (S.mode !== 'loading') render(); } }, 60000);
S._day = localToday();
render();
boot();
</script>
